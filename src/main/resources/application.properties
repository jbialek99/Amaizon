spring.application.name=amaizon
server.port=8081
server.error.whitelabel.enabled=false
server.error.path=/error
server.servlet.session.timeout=1800


spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/amaizonData}
spring.datasource.username=${DB_USER:amaizon_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=false
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5433/amaizonData}
spring.flyway.user=${DB_USER:amaizon_user}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.validate-on-migrate=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8

server.error.include-stacktrace=never
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web.FilterChainProxy=WARN
