<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${market != null ? market.locale.language : 'en'}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{staff.productCountryAdd.title}">Add country product</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="page">
<div class="container">

    <div class="card" style="margin-top:14px; width:min(820px, 100%);">
        <h1 class="h1" th:text="#{staff.productCountryAdd.heading}">Add country product</h1>
        <div class="muted" th:text="#{staff.productCountryAdd.subtitle}">Create translation, price and stock</div>

        <div class="hr"></div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <span class="badge">
                <span th:text="#{staff.productCountryAdd.baseProduct}">Base product</span>:
                <strong>
                    <span th:text="${product.brand.value}">Brand</span>
                    <span> · </span>
                    <span th:text="${product.sku.value}">CODE</span>
                </strong>
            </span>

            <span class="badge" th:if="${market != null}">
                <span th:text="#{staff.productCountryAdd.market}">Market</span>:
                <strong th:text="${market.country.name.value}">Market</strong>
            </span>
        </div>

        <div class="hr"></div>

        <form th:action="@{/staff/products/add-country/{id}(id=${product.stableId})}"
              method="post"
              class="form"
              th:object="${form}">

            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="alert danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>

            <div class="field" style="margin-top:0;">
                <label class="label" th:text="#{staff.productCountryAdd.name}">Display name</label>
                <input class="input" type="text" th:field="*{displayName}" required/>
                <div class="error-message" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></div>
            </div>

            <div class="field">
                <label class="label" th:text="#{staff.productCountryAdd.slug}">Slug</label>
                <input class="input" type="text" th:field="*{slug}" th:placeholder="#{staff.productCountryAdd.slugAuto}"/>
                <div class="muted" style="margin-top:6px;" th:text="#{staff.productCountryAdd.slugHint}">
                    If empty, slug will be generated automatically.
                </div>
                <div class="error-message" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
            </div>

            <div class="field">
                <label class="label" th:text="#{staff.productCountryAdd.description}">Description</label>
                <textarea class="input" th:field="*{description}" rows="5" required></textarea>
                <div class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="field">
                <label class="label" th:text="#{staff.productCountryAdd.price}">Price</label>
                <input class="input" type="number" step="0.01" min="0" th:field="*{price}" required/>
                <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="field">
                <label class="label" th:text="#{staff.productCountryAdd.stock}">Initial stock</label>
                <input class="input" type="number" min="0" th:field="*{initialQuantityAvailable}" required/>
                <div class="error-message" th:if="${#fields.hasErrors('initialQuantityAvailable')}" th:errors="*{initialQuantityAvailable}"></div>
            </div>

            <div class="field">
                <label class="label" th:text="#{staff.productCountryAdd.status}">Status</label>
                <select class="input" th:field="*{status}">
                    <option th:value="DRAFT" th:text="#{staff.productCountryAdd.status.draft}">DRAFT</option>
                    <option th:value="ACTIVE" th:text="#{staff.productCountryAdd.status.active}">ACTIVE</option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>

            <button class="btn primary w-100" type="submit"
                    th:text="#{staff.productCountryAdd.submit}"
                    style="margin-top:12px;">
                Create country product
            </button>

            <div class="hr" style="margin:14px 0;"></div>

            <div style="display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;">
                <a class="btn" th:href="@{/staff/products/add-country}" th:text="#{staff.productCountryAdd.back}">
                    Back to list
                </a>
                <a class="btn" th:href="@{/staff/products}" th:text="#{staff.common.cancel}">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
