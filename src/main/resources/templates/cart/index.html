<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:lang="${currentLocale != null ? currentLocale.language : 'en'}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{cart.title}">Cart</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="page">
<div class="container">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="card" style="margin-top:14px;">
        <h1 class="h1" th:text="#{cart.heading}">Your cart</h1>

        <div class="muted" th:if="${cart != null}">
            <span th:text="#{cart.itemsLabel}">Items:</span>
            <strong th:text="${#lists.size(cart.items)}">0</strong>
        </div>

        <div class="hr"></div>

        <div th:if="${cart == null || #lists.size(cart.items) == 0}" class="empty">
            <span th:text="#{cart.empty}">Cart is empty.</span>
            <div style="margin-top:10px;">
                <a class="btn" th:href="@{/}" th:text="#{nav.backHome}">Back to home</a>
            </div>
        </div>

        <div th:if="${cart != null && #lists.size(cart.items) > 0}">
            <div style="display:grid; gap:12px;">
                <div class="card"
                     style="padding:14px;"
                     th:each="i : ${cart.items}">

                    <th:block th:with="
                        product=${i.product()},
                        quantity=${i.quantity()},
                        stock=${i.product().stock()},
                        maxStock=${i.product().stock() > 0 ? i.product().stock() : 1}">

                        <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap;">

                            <div style="min-width:240px; flex:1;">
                                <div style="font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                    <span th:text="${product.name() != null ? product.name() : #messages.msg('cart.itemFallback')}">
                                        Item
                                    </span>
                                </div>

                                <div class="muted small">
                                    <span th:text="${product.globalCode() != null ? product.globalCode() : ''}">
                                        SKU
                                    </span>
                                </div>

                                <div class="muted small">
                                    <span th:text="#{cart.stockLabel}">In stock:</span>
                                    <strong th:text="${stock}">0</strong>
                                </div>
                            </div>

                            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">

                                <form th:action="@{/cart/update}"
                                      method="post"
                                      style="display:flex; gap:10px; align-items:center; margin:0;">

                                    <input type="hidden"
                                           name="productCountryStableId"
                                           th:value="${product.productCountryStableId()}"/>

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>

                                    <input class="input"
                                           style="width:96px;"
                                           type="number"
                                           min="1"
                                           th:attr="max=${maxStock}"
                                           step="1"
                                           inputmode="numeric"
                                           name="qty"
                                           th:value="${quantity}"
                                           th:aria-label="#{cart.qty}"/>

                                    <button class="btn"
                                            type="submit"
                                            th:text="#{cart.update}">
                                        Update
                                    </button>
                                </form>

                                <form th:action="@{/cart/remove}"
                                      method="post"
                                      style="margin:0;">

                                    <input type="hidden"
                                           name="productCountryStableId"
                                           th:value="${product.productCountryStableId()}"/>

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>

                                    <button class="btn danger"
                                            type="submit"
                                            th:text="#{cart.remove}">
                                        Remove
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div style="display:flex; justify-content:space-between; margin-top:10px; gap:12px; flex-wrap:wrap;">

                            <div class="muted small">
                                <span th:text="#{cart.unitPrice}">Unit:</span>

                                <strong th:text="${product.price() != null
                                    ? #numbers.formatDecimal(product.price(), 1, 'COMMA', 2, 'POINT')
                                    : '0.00'}">
                                    0.00
                                </strong>

                                <span th:text="${currencySymbol}">PLN</span>
                            </div>

                            <div class="price">
                                <span th:text="${product.price() != null
                                    ? #numbers.formatDecimal(
                                        product.price().multiply(T(java.math.BigDecimal).valueOf(quantity.longValue())),
                                        1, 'COMMA', 2, 'POINT')
                                    : '0.00'}">
                                    0.00
                                </span>

                                <span th:text="${currencySymbol}">PLN</span>
                            </div>
                        </div>

                    </th:block>
                </div>
            </div>

            <div class="hr"></div>

            <div class="cart-footer">
                <a class="btn"
                   th:href="@{/}"
                   th:text="#{cart.continueShopping}">
                    Continue shopping
                </a>

                <a class="btn primary"
                   th:href="@{/checkout}"
                   th:text="#{cart.checkout}">
                    Proceed to checkout
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
