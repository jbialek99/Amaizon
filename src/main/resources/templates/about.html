<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${currentLocale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{nav.about}">O nas</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="page">
<div class="container">

    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="card" style="margin-top:14px;">
        <h1 class="h1" th:text="#{about.title}">O nas</h1>
        <div class="muted" th:text="#{about.subtitle}"></div>
        <div class="hr"></div>

        <p th:text="#{about.p1}"></p>
        <p th:text="#{about.p2}"></p>
    </div>

    <div class="card" style="margin-top:14px;">
        <h2 th:text="#{about.whyTitle}"></h2>
        <div class="hr"></div>

        <ul style="line-height:1.9; margin:0; padding-left:18px; color:rgba(255,255,255,.9);">
            <li th:text="#{about.why1}"></li>
            <li th:text="#{about.why2}"></li>
            <li th:text="#{about.why3}"></li>
            <li th:text="#{about.why4}"></li>
        </ul>
    </div>

    <div class="checkout-layout" style="margin-top:14px;">

        <div class="card">
            <h2 th:text="#{about.contactTitle}"></h2>
            <div class="hr"></div>

            <p>
                <strong th:text="#{about.addressLabel}"></strong><br/>
                <span th:text="#{about.companyLine}"></span><br/>
                <span th:text="#{about.streetLine}"></span><br/>
                <span th:text="#{about.cityLine}"></span><br/>
                <span th:text="#{about.countryLine}"></span>
            </p>

            <p><strong th:text="#{about.emailLabel}"></strong><br/>
                <span th:text="#{about.emailValue}"></span>
            </p>

            <p><strong th:text="#{about.phoneLabel}"></strong><br/>
                <span th:text="#{about.phoneValue}"></span>
            </p>
        </div>

        <div class="card">
            <h2 th:text="#{about.mapTitle}"></h2>
            <div class="hr"></div>

            <iframe
                    src="https://www.google.com/maps?q=ul.+Marszałkowska+1,+Warszawa&output=embed"
                    width="100%"
                    height="300"
                    style="border:0; border-radius:12px;"
                    allowfullscreen=""
                    loading="lazy">
            </iframe>
        </div>

    </div>

    <div class="card" style="margin-top:14px; text-align:center;">
        <span class="muted" th:text="#{footer.copy}"></span>
    </div>

</div>
</body>
</html>
